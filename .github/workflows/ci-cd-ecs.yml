name: ci-cd-ecs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push catalog image
        id: build-catalog
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_CATALOG }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./services/catalog-service
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push order image
        id: build-order
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_ORDER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./services/order-service
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push gateway image
        id: build-gateway
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_GATEWAY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./gateway
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push frontend image
        id: build-frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_FRONTEND }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Prepare task definition templates
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECS_TASK_EXECUTION_ROLE_ARN: ${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}
          ECS_TASK_ROLE_ARN: ${{ secrets.ECS_TASK_ROLE_ARN }}
        run: |
          mkdir -p /tmp/taskdefs
          for f in catalog-task-def.json order-task-def.json gateway-task-def.json frontend-task-def.json; do
            cp infra/ecs/task-definitions/$f /tmp/taskdefs/$f
            sed -i "s|__AWS_REGION__|$AWS_REGION|g" /tmp/taskdefs/$f
            sed -i "s|__AWS_ACCOUNT_ID__|$AWS_ACCOUNT_ID|g" /tmp/taskdefs/$f
            sed -i "s|__TASK_EXECUTION_ROLE_ARN__|$ECS_TASK_EXECUTION_ROLE_ARN|g" /tmp/taskdefs/$f
            sed -i "s|__TASK_ROLE_ARN__|$ECS_TASK_ROLE_ARN|g" /tmp/taskdefs/$f
          done

      - name: Render catalog task definition
        id: taskdef-catalog
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/taskdefs/catalog-task-def.json
          container-name: catalog-service
          image: ${{ steps.build-catalog.outputs.image }}

      - name: Deploy catalog service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef-catalog.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_CATALOG }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Render order task definition
        id: taskdef-order
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/taskdefs/order-task-def.json
          container-name: order-service
          image: ${{ steps.build-order.outputs.image }}

      - name: Deploy order service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef-order.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_ORDER }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Render gateway task definition
        id: taskdef-gateway
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/taskdefs/gateway-task-def.json
          container-name: gateway
          image: ${{ steps.build-gateway.outputs.image }}

      - name: Deploy gateway service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef-gateway.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_GATEWAY }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Render frontend task definition
        id: taskdef-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/taskdefs/frontend-task-def.json
          container-name: frontend
          image: ${{ steps.build-frontend.outputs.image }}

      - name: Deploy frontend service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef-frontend.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_FRONTEND }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true
